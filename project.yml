name: StreamGlow
options:
  bundleIdPrefix: com.praisemourningstar
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.praisemourningstar.StreamGlow
    PRODUCT_NAME: StreamGlow
    SWIFT_VERSION: 5.0
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    INFOPLIST_KEY_CFBundleDisplayName: StreamGlow
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
    INFOPLIST_KEY_NSAppleEventsUsageDescription: StreamGlow reads the current song from Music and Spotify so your OBS overlay can stay live.
targets:
  StreamGlow:
    type: application
    platform: macOS
    sources:
      - path: StreamGlowApp
        excludes:
          - Resources
      - path: StreamGlowApp/Resources/Assets.xcassets
        buildPhase: resources
      - path: StreamGlowApp/Resources/Overlay
        buildPhase: resources
        type: folder
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
